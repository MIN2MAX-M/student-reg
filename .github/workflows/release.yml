name: Release (Promote)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Promote existing CI artifact -> staging/prod
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-rc') && 'staging' || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Determine version, source image, and target overlay
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"      # e.g. v1.2.0 or v1.2.0-rc1
          SHORT_SHA="${GITHUB_SHA::7}"        # tag target commit short sha

          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO_LOWER="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/${REPO_LOWER}"

          SOURCE_TAG="sha-${SHORT_SHA}"

          if [[ "${TAG}" == *"-rc"* ]]; then
            OVERLAY="staging"
            EXTRA_TAGS="${IMAGE}:${TAG}"
          else
            OVERLAY="prod"
            EXTRA_TAGS="${IMAGE}:${TAG},${IMAGE}:latest"
          fi

          BRANCH="gitops/promote-${OVERLAY}-${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "overlay=${OVERLAY}" >> "$GITHUB_OUTPUT"
          echo "extra_tags=${EXTRA_TAGS}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "Resolved:"
          echo "  TAG=${TAG}"
          echo "  IMAGE=${IMAGE}"
          echo "  SOURCE_TAG=${SOURCE_TAG}"
          echo "  OVERLAY=${OVERLAY}"
          echo "  EXTRA_TAGS=${EXTRA_TAGS}"
          echo "  BRANCH=${BRANCH}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify CI-built source image exists
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.source_tag }}" >/dev/null

      - name: Promote existing image by retagging
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.source_tag }}"
          IFS=',' read -ra TARGETS <<< "${{ steps.meta.outputs.extra_tags }}"

          ARGS=()
          for target in "${TARGETS[@]}"; do
            ARGS+=("-t" "$target")
          done

          docker buildx imagetools create "${ARGS[@]}" "$SOURCE"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Resolve promoted image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${DIGEST}"

      - name: Cosign sign promoted image by digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}"
          cosign sign --yes "${IMAGE}"

      - name: Update GitOps overlay (staging/prod)
        shell: bash
        run: |
          set -euo pipefail

          OVERLAY="${{ steps.meta.outputs.overlay }}"
          FILE="apps/student-reg/k8s/overlays/${OVERLAY}/kustomization.yaml"
          TAG="${{ steps.meta.outputs.source_tag }}"
          IMAGE="${{ steps.meta.outputs.image }}"

          echo "Updating overlay: ${OVERLAY}"
          echo "File: ${FILE}"
          echo "newName -> ${IMAGE}"
          echo "newTag  -> ${TAG}"

          if [[ ! -f "$FILE" ]]; then
            echo "ERROR: overlay file not found: $FILE"
            exit 1
          fi

          if grep -qE "^[[:space:]]*newName:" "$FILE"; then
            sed -i.bak -E "s|^([[:space:]]*newName:).*|\1 ${IMAGE}|" "$FILE"
          else
            echo "ERROR: newName not found in $FILE"
            exit 1
          fi

          if grep -qE "^[[:space:]]*newTag:" "$FILE"; then
            sed -i.bak -E "s|^([[:space:]]*newTag:).*|\1 ${TAG}|" "$FILE"
          else
            echo "ERROR: newTag not found in $FILE"
            exit 1
          fi

          rm -f "$FILE.bak"

          echo "Result:"
          grep -nE "newName:|newTag:" "$FILE" || true

      - name: Check whether overlay changed
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          FILE="apps/student-reg/k8s/overlays/${{ steps.meta.outputs.overlay }}/kustomization.yaml"

          if git diff --quiet -- "$FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No overlay change detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Overlay change detected."
          fi

      - name: Create promotion pull request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore(gitops): promote ${{ steps.meta.outputs.overlay }} ${{ steps.meta.outputs.tag }}"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          signoff: false
          branch: ${{ steps.meta.outputs.branch }}
          delete-branch: true
          title: "chore(gitops): promote ${{ steps.meta.outputs.overlay }} ${{ steps.meta.outputs.tag }}"
          body: |
            Automated promotion PR created by the release workflow.

            **Overlay:** `${{ steps.meta.outputs.overlay }}`
            **Release tag:** `${{ steps.meta.outputs.tag }}`
            **Source image tag:** `${{ steps.meta.outputs.source_tag }}`
            **Image:** `${{ steps.meta.outputs.image }}`

            This PR updates the GitOps overlay to point to the promoted image.
          base: main
          labels: |
            gitops
            promotion
          add-paths: |
            apps/student-reg/k8s/overlays/${{ steps.meta.outputs.overlay }}/kustomization.yaml
